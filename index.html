<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trilha DS — Plataforma de estudos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F7FA; --card:#FFFFFF; --ink:#10233B; --ink-soft:#4A5B72; --line:#DCE4EE;
  --f1:#1F77B4; --f2:#2CA02C; --f3:#FF7F0E; --f4:#D62728; --f5:#9467BD; --f6:#8C564B;
  --ok:#2CA02C; --err:#C62828; --chart-grid:#E3EAF3; --side:#0F1B2D; --side-ink:#C7D4E4;
  --display:'Space Grotesk',sans-serif; --body:'IBM Plex Sans',sans-serif; --mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
a{color:var(--f1)}
button{font-family:inherit}

#app{display:flex;min-height:100vh}
aside{width:290px;background:var(--side);color:var(--side-ink);position:fixed;top:0;bottom:0;left:0;overflow-y:auto;padding:18px 14px 30px;z-index:40;transition:transform .25s}
.main{flex:1;margin-left:290px;min-width:0}
.topbar{position:sticky;top:0;z-index:30;background:rgba(244,247,250,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 22px}
#burger{display:none;background:none;border:1px solid var(--line);border-radius:8px;width:36px;height:32px;font-size:16px;cursor:pointer;color:var(--ink)}
.crumb{font-family:var(--mono);font-size:12px;color:var(--ink-soft);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#saveState{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
#saveState.ok::before{content:"●";color:var(--ok);margin-right:5px}
#saveState.warn::before{content:"●";color:var(--f3);margin-right:5px}
#content{padding:24px 26px 60px;max-width:960px}
@media(max-width:900px){
  aside{transform:translateX(-100%)} body.side-open aside{transform:none}
  .main{margin-left:0} #burger{display:block}
  body.side-open::after{content:"";position:fixed;inset:0;background:rgba(16,35,59,.45);z-index:35}
}

.brand{font-family:var(--display);font-weight:700;font-size:17px;color:#fff;padding:4px 8px 2px}
.brand span{color:#6FB3E0}
.brand-sub{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#7E93AC;padding:0 8px 14px}
.nav-dash{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:#16304F;border:1px solid #24466E;color:#fff;border-radius:9px;padding:9px 12px;font-size:13.5px;cursor:pointer;margin-bottom:14px}
.nav-dash:hover{background:#1B3A5F}
.nav-fase{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#7E93AC;margin:14px 8px 6px;display:flex;align-items:center;gap:7px}
.nav-fase i{width:8px;height:8px;border-radius:2px;background:var(--c);display:inline-block}
.nav-mod{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;color:var(--side-ink);border-radius:8px;padding:7px 8px;font-size:13px;cursor:pointer;line-height:1.3}
.nav-mod:hover{background:#16304F}
.nav-mod.active{background:#1F4260;color:#fff}
.nav-mod .nn{font-family:var(--mono);font-size:10.5px;color:#7E93AC;min-width:18px}
.nav-mod .nt{flex:1}
.nav-mod .np{font-family:var(--mono);font-size:10.5px;color:#8FB8DB;min-width:34px;text-align:right}
.nav-mod.done .np{color:#7FD48A}

.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.panel h2{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);font-weight:500;margin-bottom:10px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(22px,3.6vw,32px);line-height:1.15;margin-bottom:6px}
.sub{color:var(--ink-soft);max-width:680px;margin-bottom:16px}
.aviso{background:#FFF8EC;border:1px solid #F2DFAE;border-radius:12px;padding:11px 15px;font-size:13px;color:#6B5310;margin-bottom:16px}
.aviso code{font-family:var(--mono);font-size:12px;background:#FBEECB;padding:1px 5px;border-radius:4px}

.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#FBFDFF}
.stat b{font-family:var(--display);font-size:23px;display:block;line-height:1.1}
.stat span{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.ritmo{margin-top:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ritmo label{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft)}
.ritmo select{font-family:var(--mono);font-size:12px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.eta{font-size:13px;color:var(--ink-soft);margin-top:8px}
.eta b,.milestones b{color:var(--ink)}
.milestones{margin-top:10px;font-size:12.5px;color:var(--ink-soft);border-top:1px dashed var(--line);padding-top:10px}
.curve-note{font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin-top:6px}

.mod-hero{border-left:5px solid var(--c);padding-left:14px;margin-bottom:18px}
.mod-hero .tag{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--c);padding:3px 9px;border-radius:6px}
.mod-hero .meta{font-family:var(--mono);font-size:12px;color:var(--ink-soft);margin-top:6px}
.secT{font-family:var(--display);font-size:17px;margin:22px 0 10px}
.item{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid #EEF3F9}
.item:last-child{border-bottom:none}
.tipo{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--ink-soft);border-radius:5px;padding:2px 7px;margin-top:2px;white-space:nowrap}
.tipo.curso{background:var(--f1)} .tipo.video{background:#B8860B} .tipo.cert{background:var(--f5)}
.tipo.pratica{background:var(--f3)} .tipo.entrega{background:var(--f4)} .tipo.livro{background:#0E7C7B}
.item .txt{flex:1}
.item .nome{font-weight:500}
.item .desc{font-size:12.5px;color:var(--ink-soft)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.acts button,.acts a{font-family:var(--mono);font-size:11.5px;border:1px solid var(--f1);color:var(--f1);background:#fff;border-radius:7px;padding:4px 10px;cursor:pointer;text-decoration:none}
.acts button:hover,.acts a:hover{background:var(--f1);color:#fff}
.chk{display:flex;align-items:center;gap:7px;cursor:pointer;font-family:var(--mono);font-size:11px;color:var(--ink-soft);white-space:nowrap;margin-top:2px}
.chk input{width:17px;height:17px;accent-color:var(--ok);cursor:pointer}
.item.feito .txt{opacity:.55}
.item.feito .nome{text-decoration:line-through}
.player{margin:8px 0 4px}
.player .frame{position:relative;width:100%;max-width:680px;aspect-ratio:16/9;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#0F1B2D}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.player .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#DCE4EE;cursor:pointer;background:linear-gradient(135deg,#12263F,#0F1B2D)}
.playbtn{width:60px;height:42px;border-radius:12px;background:var(--f4);display:flex;align-items:center;justify-content:center;transition:transform .15s}
.player .ph:hover .playbtn{transform:scale(1.08)}
.playbtn::after{content:"";border-style:solid;border-width:9px 0 9px 15px;border-color:transparent transparent transparent #fff;margin-left:3px}
.player .ph span{font-family:var(--mono);font-size:12px}
.player .fb{font-size:12px;color:var(--ink-soft);margin-top:4px}
.navmod-foot{display:flex;justify-content:space-between;margin-top:26px;gap:10px}
.navmod-foot button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;cursor:pointer;color:var(--ink)}
.navmod-foot button:hover{border-color:var(--f1);color:var(--f1)}
.navmod-foot button:disabled{opacity:.4;cursor:default}

.ex{border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden;background:var(--card)}
.ex-head{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;user-select:none}
.ex-head:hover{background:#FBFDFF}
.ex-head .badge{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:#123B5C;color:#fff;border-radius:5px;padding:2px 7px}
.ex-head .et{font-weight:600;flex:1}
.ex-head .est{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.ex-head .est.ok{color:var(--ok);font-weight:600}
.ex-body{display:none;border-top:1px dashed var(--line);padding:14px 16px}
.ex.open .ex-body{display:block}
.enun{font-size:14px;margin-bottom:10px}
.enun code,.esperado code{font-family:var(--mono);font-size:12.5px;background:#EEF3F9;padding:1px 5px;border-radius:4px}
.esperado{background:#F2F7FC;border:1px solid #D9E7F4;border-radius:9px;padding:9px 12px;font-size:12.5px;margin-bottom:10px}
.esperado b{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:4px}
.esperado pre{font-family:var(--mono);font-size:12px;white-space:pre-wrap}
.editor{width:100%;min-height:170px;font-family:var(--mono);font-size:13px;line-height:1.5;background:#0F1B2D;color:#E7EEF6;border:1px solid #24466E;border-radius:10px;padding:12px;resize:vertical;tab-size:4}
.editor:focus{outline:2px solid var(--f1)}
.ex-actions{display:flex;gap:9px;align-items:center;margin-top:9px;flex-wrap:wrap}
.btn-run{background:var(--ok);color:#fff;border:none;border-radius:8px;padding:7px 16px;font-family:var(--mono);font-size:12.5px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.btn-run:hover{filter:brightness(1.07)}
.btn-run:disabled{background:#9BB2C8;cursor:wait}
.btn-ghost{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-family:var(--mono);font-size:12px;cursor:pointer;color:var(--ink-soft)}
.btn-ghost:hover{border-color:var(--f1);color:var(--f1)}
.saida{margin-top:10px;border-radius:10px;border:1px solid var(--line);overflow:hidden;display:none}
.saida.show{display:block}
.saida .s-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;background:#EEF3F9;color:var(--ink-soft)}
.saida pre{font-family:var(--mono);font-size:12.5px;padding:10px 12px;white-space:pre-wrap;max-height:220px;overflow:auto}
.veredito{padding:10px 12px;font-size:13.5px;border-top:1px solid var(--line)}
.veredito.ok{background:#EAF6EA;color:#1E5E1E}
.veredito.err{background:#FDECEC;color:#8E1F1F}
.veredito .ajuste{margin-top:6px;font-size:12.5px;color:#6B4A10;background:#FFF6E3;border:1px solid #F0E0B4;border-radius:8px;padding:8px 10px}
details.gab{margin-top:10px}
details.gab summary{font-family:var(--mono);font-size:12px;color:var(--ink-soft);cursor:pointer}
details.gab pre{font-family:var(--mono);font-size:12.5px;background:#F2F7FC;border:1px solid #D9E7F4;border-radius:9px;padding:10px 12px;margin-top:6px;white-space:pre-wrap}
#pyStatus{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft)}

.viewer-bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.viewer-bar button,.viewer-bar a{font-family:var(--mono);font-size:12px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;text-decoration:none}
.viewer-bar a{border-color:var(--f1);color:var(--f1)}
.viewer-frame{width:100%;height:calc(100vh - 190px);min-height:420px;border:1px solid var(--line);border-radius:12px;background:#fff}
.viewer-note{font-size:12.5px;color:#6B5310;background:#FFF8EC;border:1px solid #F2DFAE;border-radius:9px;padding:8px 12px;margin-top:8px}

button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.ex-head:focus-visible,.player .ph:focus-visible{outline:2px solid var(--f1);outline-offset:2px}
</style>
</head>
<body>
<div id="app">
<aside id="sidebar">
  <div class="brand">Trilha<span>DS</span></div>
  <div class="brand-sub">analista → cientista especialista</div>
  <button class="nav-dash" data-go="dash">📈 Painel de progresso</button>
  <nav id="nav"></nav>
</aside>
<div class="main">
  <div class="topbar">
    <button id="burger" aria-label="Abrir menu">☰</button>
    <span class="crumb" id="crumb">Painel</span>
    <span id="pyStatus"></span>
    <span id="saveState">carregando…</span>
  </div>
  <div id="content"></div>
</div>
</div>

 {id:"f1",cor:"var(--f1)",tag:"Fase 1",nome:"Fundamentos"},

  topicos:"Processo completo: perguntas de negócio, limpeza, outliers, análises univariada/bivariada, insights e comunicação.",
  itens:[
   {id:"m5c1",t:"curso",n:"freeCodeCamp — Data Analysis with Python",d:"Com certificação gratuita ao final.",u:"https://www.freecodecamp.org/learn/data-analysis-with-python/",cert:true},
   {id:"m5v1",t:"video",n:"Programação Dinâmica — análise de dados",d:"Canal brasileiro de referência.",u:"https://www.youtube.com/@ProgramacaoDinamica"},
   {id:"m5p1",t:"pratica",n:"EDA completa do dataset Olist (e-commerce BR)",d:"3 perguntas de negócio; responda cada uma com dados.",u:"https://www.kaggle.com/datasets/olistbr/brazilian-ecommerce"},

 {n:6,fase:"f2",titulo:"Matemática para Machine Learning",h:25,

   {id:"m6c1",t:"curso",n:"Khan Academy — Álgebra Linear",d:"Vetores, matrizes e transformações.",u:"https://pt.khanacademy.org/math/linear-algebra"},
   {id:"m6v1",t:"video",n:"3Blue1Brown — Essence of Linear Algebra",d:"Intuição visual incomparável (legendado).",u:"https://www.youtube.com/@3blue1brown/playlists",embed:"PLZHQObOWTQDPD3MizzM2xVFitgF8hE_ab"},
   {id:"m6e1",t:"entrega",n:"Notebook com regressão linear implementada do zero",d:"Comente cada passo do algoritmo."},
  ]},
 {n:7,fase:"f3",titulo:"Machine Learning — fundamentos",h:50,
  topicos:"Supervisionado × não supervisionado, regressão linear/logística, árvores, KNN, treino/validação/teste, overfitting e scikit-learn.",
  itens:[
   {id:"m7c1",t:"curso",n:"Kaggle Learn — Intro to Machine Learning",d:"Primeiro modelo em poucas horas.",u:"https://www.kaggle.com/learn/intro-to-machine-learning",cert:true},
   {id:"m7c2",t:"curso",n:"Google — ML Crash Course (PT-BR)",d:"Reforço com exercícios interativos.",u:"https://developers.google.com/machine-learning/crash-course"},
   {id:"m7v1",t:"video",n:"StatQuest — Machine Learning",d:"Cada algoritmo explicado com clareza.",u:"https://www.youtube.com/@statquest/playlists",embed:"PLblh5JKOoLUICTaGLRoHQDuF_7q2GfuJF"},

 {id:"e1",mod:1,titulo:"Par ou ímpar",
  enun:'Crie a função <code>par_ou_impar(n)</code> que recebe um número inteiro e retorna a string <code>"par"</code> ou <code>"ímpar"</code>.',
  esperado:'par_ou_impar(4) → "par"\npar_ou_impar(7) → "ímpar"\npar_ou_impar(0) → "par"',
  starter:'def par_ou_impar(n):\n    # seu código aqui\n    ...\n\n# teste você mesmo antes de verificar:\nprint(par_ou_impar(4))',
  test:'assert par_ou_impar(4)=="par", f"par_ou_impar(4) deveria ser \'par\', retornou {par_ou_impar(4)!r}"\nassert par_ou_impar(7)=="ímpar", f"par_ou_impar(7) deveria ser \'ímpar\', retornou {par_ou_impar(7)!r}"\nassert par_ou_impar(0)=="par", f"par_ou_impar(0) deveria ser \'par\' (zero é par), retornou {par_ou_impar(0)!r}"\nassert par_ou_impar(-3)=="ímpar", f"par_ou_impar(-3) deveria ser \'ímpar\', retornou {par_ou_impar(-3)!r}"',
  dica:"Use o operador % (resto da divisão): se n % 2 == 0, o número é par. Lembre que zero é par e o teste também usa número negativo.",
  gab:'def par_ou_impar(n):\n    if n % 2 == 0:\n        return "par"\n    return "ímpar"'},
 {id:"e2",mod:1,titulo:"FizzBuzz das vendas",
  enun:'Clássico de entrevista: crie <code>fizzbuzz(n)</code> que retorna uma <b>lista</b> de 1 até n onde múltiplos de 3 viram <code>"Fizz"</code>, múltiplos de 5 viram <code>"Buzz"</code>, múltiplos de ambos viram <code>"FizzBuzz"</code> e os demais ficam como número.',
  esperado:'fizzbuzz(5) → [1, 2, "Fizz", 4, "Buzz"]\nfizzbuzz(15)[14] → "FizzBuzz"',
  starter:'def fizzbuzz(n):\n    resultado = []\n    # seu código aqui\n    return resultado\n\nprint(fizzbuzz(5))',
  test:'r=fizzbuzz(15)\nassert isinstance(r,list), "A função deve retornar uma lista"\nassert len(r)==15, f"fizzbuzz(15) deve ter 15 elementos, tem {len(r)}"\nassert r[0]==1 and r[1]==2, "Números que não são múltiplos de 3 nem 5 devem ficar como inteiros"\nassert r[2]=="Fizz", f"posição 3 deveria ser \'Fizz\', veio {r[2]!r}"\nassert r[4]=="Buzz", f"posição 5 deveria ser \'Buzz\', veio {r[4]!r}"\nassert r[14]=="FizzBuzz", f"posição 15 deveria ser \'FizzBuzz\', veio {r[14]!r}"',
  dica:"Teste PRIMEIRO a condição de múltiplo de 3 E 5 (n % 15 == 0), senão 'Fizz' ou 'Buzz' capturam antes. Use range(1, n+1).",
  gab:'def fizzbuzz(n):\n    resultado = []\n    for i in range(1, n + 1):\n        if i % 15 == 0:\n            resultado.append("FizzBuzz")\n        elif i % 3 == 0:\n            resultado.append("Fizz")\n        elif i % 5 == 0:\n            resultado.append("Buzz")\n        else:\n            resultado.append(i)\n    return resultado'},
 {id:"e3",mod:1,titulo:"Média de vendas",
  enun:'Crie <code>media(valores)</code> que recebe uma lista de números e retorna a média aritmética arredondada para 2 casas decimais (use <code>round</code>). Se a lista estiver vazia, retorne <code>0</code>.',
  esperado:'media([100, 200, 250]) → 183.33\nmedia([]) → 0',
  starter:'def media(valores):\n    # seu código aqui\n    ...\n\nprint(media([100, 200, 250]))',
  test:'assert media([100,200,250])==183.33, f"media([100,200,250]) deveria ser 183.33, retornou {media([100,200,250])}"\nassert media([10])==10.0 or media([10])==10, "média de um único valor é o próprio valor"\nassert media([])==0, "lista vazia deve retornar 0 (proteja a divisão por zero!)"',
  dica:"sum(valores) / len(valores) resolve — mas proteja o caso de lista vazia ANTES de dividir, senão dá ZeroDivisionError. Isso vale para qualquer denominador na sua carreira.",
  gab:'def media(valores):\n    if len(valores) == 0:\n        return 0\n    return round(sum(valores) / len(valores), 2)'},
 {id:"e4",mod:2,titulo:"GROUP BY em Python puro",
  enun:'Você faz isso em SQL todo dia. Agora em Python: crie <code>total_por_regiao(vendas)</code> que recebe uma lista de dicionários com as chaves <code>"regiao"</code> e <code>"valor"</code> e retorna um dicionário {região: soma}.',
  esperado:'total_por_regiao([\n  {"regiao": "Sul", "valor": 100},\n  {"regiao": "Norte", "valor": 50},\n  {"regiao": "Sul", "valor": 30},\n]) → {"Sul": 130, "Norte": 50}',
  starter:'def total_por_regiao(vendas):\n    totais = {}\n    # seu código aqui\n    return totais\n\nvendas = [\n    {"regiao": "Sul", "valor": 100},\n    {"regiao": "Norte", "valor": 50},\n    {"regiao": "Sul", "valor": 30},\n]\nprint(total_por_regiao(vendas))',
  test:'v=[{"regiao":"Sul","valor":100},{"regiao":"Norte","valor":50},{"regiao":"Sul","valor":30}]\nr=total_por_regiao(v)\nassert r=={"Sul":130,"Norte":50}, f"esperado Sul=130 e Norte=50, retornou {r}"\nassert total_por_regiao([])=={}, "lista vazia deve retornar dicionário vazio"',
  dica:"Percorra a lista e use dict.get: totais[v['regiao']] = totais.get(v['regiao'], 0) + v['valor']. É o equivalente do SELECT regiao, SUM(valor) ... GROUP BY regiao.",
  gab:'def total_por_regiao(vendas):\n    totais = {}\n    for v in vendas:\n        totais[v["regiao"]] = totais.get(v["regiao"], 0) + v["valor"]\n    return totais'},
 {id:"e5",mod:2,titulo:"INNER JOIN em Python puro",
  enun:'Crie <code>juntar(clientes, pedidos)</code> que faz o equivalente a um INNER JOIN por <code>"id"</code>/<code>"id_cliente"</code>: retorna uma lista de dicionários com <code>"nome"</code> e <code>"valor"</code> de cada pedido que tem cliente correspondente.',
  esperado:'clientes = [{"id": 1, "nome": "Ana"}, {"id": 2, "nome": "Bruno"}]\npedidos = [{"id_cliente": 1, "valor": 100}, {"id_cliente": 3, "valor": 999}]\njuntar(clientes, pedidos) → [{"nome": "Ana", "valor": 100}]',
  starter:'def juntar(clientes, pedidos):\n    resultado = []\n    # dica: crie primeiro um dicionário id -> nome\n    return resultado\n\nclientes = [{"id": 1, "nome": "Ana"}, {"id": 2, "nome": "Bruno"}]\npedidos = [{"id_cliente": 1, "valor": 100}, {"id_cliente": 3, "valor": 999}]\nprint(juntar(clientes, pedidos))',
  test:'c=[{"id":1,"nome":"Ana"},{"id":2,"nome":"Bruno"}]\np=[{"id_cliente":1,"valor":100},{"id_cliente":3,"valor":999},{"id_cliente":2,"valor":40}]\nr=juntar(c,p)\nassert r==[{"nome":"Ana","valor":100},{"nome":"Bruno","valor":40}], f"esperado [Ana/100, Bruno/40] — o pedido do cliente 3 não tem cliente e deve ser descartado (INNER JOIN). Retornou {r}"',
  dica:"Monte um índice: mapa = {c['id']: c['nome'] for c in clientes}. Depois, para cada pedido, inclua no resultado apenas se pedido['id_cliente'] estiver no mapa — exatamente o comportamento do INNER JOIN (descarta o que não casa).",
  gab:'def juntar(clientes, pedidos):\n    mapa = {c["id"]: c["nome"] for c in clientes}\n    resultado = []\n    for ped in pedidos:\n        if ped["id_cliente"] in mapa:\n            resultado.append({"nome": mapa[ped["id_cliente"]], "valor": ped["valor"]})\n    return resultado'},
 {id:"e6",mod:3,titulo:"Desvio padrão amostral",
  enun:'Crie <code>desvio_padrao(amostra)</code> que calcula o desvio padrão <b>amostral</b> (divisor n−1), arredondado para 4 casas. Use apenas <code>math</code> — nada de bibliotecas prontas: o objetivo é entender a fórmula.',
  esperado:'desvio_padrao([10, 12, 23, 23, 16, 23, 21, 16]) → 5.2372',
  starter:'import math\n\ndef desvio_padrao(amostra):\n    # 1) calcule a média\n    # 2) some os quadrados das diferenças para a média\n    # 3) divida por (n - 1) e tire a raiz\n    ...\n\nprint(desvio_padrao([10, 12, 23, 23, 16, 23, 21, 16]))',
  test:'r=desvio_padrao([10,12,23,23,16,23,21,16])\nassert abs(r-5.2372)<0.001, f"esperado 5.2372 (divisor n-1, amostral). Retornou {r}. Se veio ~4.898, você usou n (populacional) em vez de n-1."\nassert abs(desvio_padrao([5,5,5])-0)<1e-9, "valores iguais têm desvio padrão 0"',
  dica:"média = sum(a)/n; soma_q = sum((x - média)**2 for x in a); resultado = math.sqrt(soma_q / (n - 1)). O erro mais comum é dividir por n — isso é o desvio populacional, não o amostral.",
  gab:'import math\n\ndef desvio_padrao(amostra):\n    n = len(amostra)\n    m = sum(amostra) / n\n    soma_q = sum((x - m) ** 2 for x in amostra)\n    return round(math.sqrt(soma_q / (n - 1)), 4)'},
 {id:"e7",mod:3,titulo:"Z-score",
  enun:'Crie <code>z_score(x, media, desvio)</code> que retorna quantos desvios padrão o valor x está da média, arredondado para 2 casas. É a base de padronização e detecção de outliers.',
  esperado:'z_score(85, 70, 10) → 1.5\nz_score(55, 70, 10) → -1.5',
  starter:'def z_score(x, media, desvio):\n    ...\n\nprint(z_score(85, 70, 10))',
  test:'assert z_score(85,70,10)==1.5, f"esperado 1.5, retornou {z_score(85,70,10)}"\nassert z_score(55,70,10)==-1.5, f"esperado -1.5, retornou {z_score(55,70,10)}"\nassert z_score(70,70,10)==0.0 or z_score(70,70,10)==0, "valor igual à média tem z-score 0"',
  dica:"z = (x − média) / desvio. Um z-score acima de 3 ou abaixo de −3 costuma indicar outlier.",
  gab:'def z_score(x, media, desvio):\n    return round((x - media) / desvio, 2)'},
 {id:"e8",mod:4,titulo:"Gráfico de barras em ASCII",
  enun:'Antes do matplotlib, o conceito: crie <code>grafico_barras(dados)</code> que recebe um dict {categoria: quantidade} e retorna uma <b>lista de strings</b> no formato <code>"Categoria: ####"</code> (um # por unidade), na ordem do dicionário.',

  test:'r=grafico_barras({"Sul":4,"Norte":2})\nassert r==["Sul: ####","Norte: ##"], f"esperado [\'Sul: ####\', \'Norte: ##\'], retornou {r}"\nassert grafico_barras({"X":0})==["X: "], "categoria com 0 deve gerar barra vazia (\'X: \')"',

  starter:'def matriz_confusao(y_true, y_pred):\n    m = {"tp": 0, "tn": 0, "fp": 0, "fn": 0}\n    # percorra os pares (real, previsto) com zip\n    return m\n\ndef acuracia(y_true, y_pred):\n    ...\n\ny_true = [1, 0, 1, 1, 0]\ny_pred = [1, 0, 0, 1, 1]\nprint(matriz_confusao(y_true, y_pred))\nprint(acuracia(y_true, y_pred))',

  gab:'def matriz_confusao(y_true, y_pred):\n    m = {"tp": 0, "tn": 0, "fp": 0, "fn": 0}\n    for real, prev in zip(y_true, y_pred):\n        if real == 1 and prev == 1: m["tp"] += 1\n        elif real == 0 and prev == 0: m["tn"] += 1\n        elif real == 0 and prev == 1: m["fp"] += 1\n        else: m["fn"] += 1\n    return m\n\ndef acuracia(y_true, y_pred):\n    acertos = sum(1 for r, p in zip(y_true, y_pred) if r == p)\n    return round(acertos / len(y_true), 4)'},

const TOTAL_CERT=MODULOS.reduce((s,m)=>s+m.itens.filter(i=>i.cert).length,0);
const H_EMPREGAVEL=MODULOS.filter(m=>m.n<=9).reduce((s,m)=>s+m.h,0);
const H_NUCLEO=MODULOS.filter(m=>m.n<=13).reduce((s,m)=>s+m.h,0);
const exDoMod=n=>EXERCICIOS.filter(e=>e.mod===n);

/* ================= ESTADO ================= */
const KEY="trilha_ds_progresso_v2";
let estado={},storageOk=false;
function temStorage(){return typeof window.storage!=="undefined"&&window.storage;}
async function carregar(){
  try{
    if(!temStorage()) throw new Error("sem storage");
    const r=await window.storage.get(KEY);
    estado=r&&r.value?JSON.parse(r.value):{};storageOk=true;
  }catch(e){
    try{const v=localStorage.getItem(KEY);estado=v?JSON.parse(v):{};storageOk=true;}
    catch(e2){estado={};storageOk=false;}
  }
  setSaveMsg();
}
let saveTimer=null;
function salvar(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{
      if(temStorage()){await window.storage.set(KEY,JSON.stringify(estado));}
      else{localStorage.setItem(KEY,JSON.stringify(estado));}
      storageOk=true;
    }catch(e){
      try{localStorage.setItem(KEY,JSON.stringify(estado));storageOk=true;}
      catch(e2){storageOk=false;}
    }
    setSaveMsg();
  },400);
}
function setSaveMsg(){
  const el=document.getElementById("saveState");
  if(!el)return;
  if(storageOk){el.className="ok";el.textContent="progresso salvo";}
  else{el.className="warn";el.textContent="progresso só nesta sessão";}
}

/* ================= PROGRESSO ================= */
function progressoModulo(m){
  const exs=exDoMod(m.n);
  const total=m.itens.length+exs.length;
  const done=m.itens.filter(it=>estado[it.id]).length+exs.filter(e=>estado["ex_"+e.id]).length;
  return total?done/total:0;
}
function horasFeitas(){return MODULOS.reduce((s,m)=>s+m.h*progressoModulo(m),0);}

/* ================= PYODIDE (compilador) ================= */
let pyodidePromise=null;
const HARNESS=`
import sys, io, json, traceback
def _run_exercise(user_code, test_code):
    ns = {}
    buf = io.StringIO()
    old = sys.stdout
    sys.stdout = buf
    ok = True
    err = ""
    try:
        exec(user_code, ns)
        exec(test_code, ns)
    except AssertionError as e:
        ok = False
        err = "TESTE: " + str(e)
    except Exception:
        ok = False
        err = traceback.format_exc(limit=3)
    finally:
        sys.stdout = old
    return json.dumps({"ok": ok, "out": buf.getvalue(), "err": err})
`;
function getPyodide(){
  if(!pyodidePromise){
    const st=document.getElementById("pyStatus");
    st.textContent="⏳ carregando Python…";
    pyodidePromise=new Promise((res,rej)=>{
      const s=document.createElement("script");
      s.src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js";
      s.onload=async()=>{
        try{
          const py=await loadPyodide({indexURL:"https://cdn.jsdelivr.net/pyodide/v0.25.1/full/"});
          py.runPython(HARNESS);
          st.textContent="🐍 Python pronto";
          res(py);
        }catch(e){rej(e);}
      };
      s.onerror=()=>rej(new Error("cdn"));
      document.head.appendChild(s);
    }).catch(e=>{
      st.textContent="⚠ Python indisponível";
      pyodidePromise=null;
      throw e;
    });
  }
  return pyodidePromise;
}
async function executarExercicio(ex,btn){
  const card=btn.closest(".ex");
  const saida=card.querySelector(".saida");
  const pre=card.querySelector(".saida pre");
  const ver=card.querySelector(".veredito");
  const code=card.querySelector(".editor").value;
  btn.disabled=true;btn.textContent="⏳ Executando…";
  saida.classList.add("show");pre.textContent="";
  ver.className="veredito";ver.innerHTML="Executando no ambiente Python do navegador…";
  try{
    const py=await getPyodide();
    py.globals.set("uc",code);
    py.globals.set("tc",ex.test);
    const res=JSON.parse(py.runPython("_run_exercise(uc, tc)"));
    pre.textContent=res.out||"(sem saída no print)";
    if(res.ok){
      ver.className="veredito ok";
      ver.innerHTML="✅ <b>Correto!</b> Todos os testes passaram. Exercício marcado como concluído.";
      if(!estado["ex_"+ex.id]){estado["ex_"+ex.id]=true;salvar();atualizarUI();}
      const est=card.querySelector(".est");
      est.textContent="✔ concluído";est.classList.add("ok");
    }else{
      ver.className="veredito err";
      ver.innerHTML="❌ <b>Ainda não.</b><br><span style='font-family:var(--mono);font-size:12px'>"+escapeHtml(res.err)+"</span>"+
        "<div class='ajuste'>💡 <b>Ajuste sugerido:</b> "+ex.dica+"</div>";
    }
  }catch(e){
    ver.className="veredito err";
    ver.innerHTML="⚠ Não foi possível carregar o ambiente Python (requer internet no primeiro uso, ~10&nbsp;MB via CDN). Verifique a conexão e tente de novo.";
  }
  btn.disabled=false;btn.textContent="▶ Executar e verificar";
}
function escapeHtml(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function atualizarUI(){
  MODULOS.forEach(m=>{
    const p=Math.round(100*progressoModulo(m));
    const el=document.querySelector(`[data-navpct="${m.n}"]`);
    if(el){el.textContent=p+"%";el.closest(".nav-mod").classList.toggle("done",p===100);}
  });

}

function preencherDash(){
  if(viewAtual.tipo!=="dash")return;
  const horas=horasFeitas();
  let certs=0;MODULOS.forEach(m=>m.itens.forEach(it=>{if(it.cert&&estado[it.id])certs++;}));
  const exDone=EXERCICIOS.filter(e=>estado["ex_"+e.id]).length;
  document.getElementById("stPct").textContent=Math.round(100*horas/TOTAL_H)+"%";
  document.getElementById("stHoras").textContent=Math.round(horas)+"h / "+TOTAL_H+"h";
  document.getElementById("stEx").textContent=exDone+" / "+EXERCICIOS.length;
  document.getElementById("stCert").textContent=certs+" / "+TOTAL_CERT;
  const ritmo=Number(document.getElementById("ritmo").value);
  const rTot=Math.max(0,TOTAL_H-horas);
  const rEmp=Math.max(0,H_EMPREGAVEL-Math.min(horas,H_EMPREGAVEL));
  const rNuc=Math.max(0,H_NUCLEO-Math.min(horas,H_NUCLEO));
  const sem=h=>Math.ceil(h/ritmo);
  document.getElementById("eta").innerHTML=rTot===0?"<b>Trilha completa — nível especialista.</b>":`trilha completa: faltam <b>${Math.round(rTot)}h</b> ≈ <b>${sem(rTot)} semanas</b>`;
  document.getElementById("milestones").innerHTML=
    `▲ <b>Empregável</b> (fim da Fase 3, ${H_EMPREGAVEL}h): ${rEmp===0?"<b>atingido — aplique para vagas!</b>":`≈ ${sem(rEmp)} semanas`}<br>`+
    `■ <b>Núcleo completo</b> (fim da Fase 5, ${H_NUCLEO}h): ${rNuc===0?"<b>atingido</b>":`≈ ${sem(rNuc)} semanas`}`;
  desenharCurva();
}
function desenharCurva(){
  const svg=document.getElementById("curve");if(!svg)return;
  const W=640,H=250,mL=44,mR=14,mT=14,mB=32,iw=W-mL-mR,ih=H-mT-mB;
  let acP=0,acR=0;const plano=[{x:0,y:0}],real=[{x:0,y:0}];
  MODULOS.forEach((m,i)=>{acP+=m.h;acR+=m.h*progressoModulo(m);plano.push({x:i+1,y:acP/TOTAL_H});real.push({x:i+1,y:acR/TOTAL_H});});
  const X=v=>mL+iw*v/MODULOS.length,Y=v=>mT+ih*(1-v);
  const path=p=>p.map((q,i)=>(i?"L":"M")+X(q.x).toFixed(1)+","+Y(q.y).toFixed(1)).join(" ");
  let g="";
  for(let t=0;t<=4;t++){const y=Y(t/4);
    g+=`<line x1="${mL}" y1="${y}" x2="${W-mR}" y2="${y}" stroke="var(--chart-grid)"/>`;
    g+=`<text x="${mL-8}" y="${y+4}" text-anchor="end" font-family="IBM Plex Mono" font-size="10" fill="var(--ink-soft)">${t*25}%</text>`;}
  for(let m=1;m<=MODULOS.length;m++)g+=`<text x="${X(m)}" y="${H-12}" text-anchor="middle" font-family="IBM Plex Mono" font-size="9" fill="var(--ink-soft)">${m}</text>`;
  g+=`<text x="${(mL+W-mR)/2}" y="${H-1}" text-anchor="middle" font-family="IBM Plex Mono" font-size="9" fill="var(--ink-soft)">módulo (época)</text>`;
  const xE=X(9),xN=X(13);
  g+=`<line x1="${xE}" y1="${mT}" x2="${xE}" y2="${H-mB}" stroke="var(--f3)" stroke-dasharray="3 4" opacity=".7"/><text x="${xE}" y="${mT+2}" text-anchor="middle" font-size="10" fill="var(--f3)">▲</text>`;
  g+=`<line x1="${xN}" y1="${mT}" x2="${xN}" y2="${H-mB}" stroke="var(--f5)" stroke-dasharray="3 4" opacity=".7"/><text x="${xN}" y="${mT+2}" text-anchor="middle" font-size="10" fill="var(--f5)">■</text>`;
  g+=`<path d="${path(plano)}" fill="none" stroke="var(--ink-soft)" stroke-width="1.5" stroke-dasharray="5 5" opacity=".55"/>`;
  g+=`<path d="${path(real)}" fill="none" stroke="var(--f1)" stroke-width="2.5" stroke-linejoin="round"/>`;
  real.forEach((p,i)=>{if(i===0)return;const full=progressoModulo(MODULOS[i-1])===1;
    g+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${full?4.5:3}" fill="${full?"var(--ok)":"#fff"}" stroke="var(--f1)" stroke-width="1.8"/>`;});
  svg.innerHTML=g;
}

/* ---------- módulo ---------- */
function renderModulo(n){
  const m=MODULOS.find(x=>x.n===n);
  const f=FASES.find(x=>x.id===m.fase);
  const exs=exDoMod(n);
  crumb.textContent=`${f.tag} · Módulo ${String(n).padStart(2,"0")} — ${m.titulo}`;
  content.innerHTML=`
    <div class="mod-hero" style="--c:${f.cor}">
      <span class="tag">${f.tag} · ${f.nome}</span>
      <h1>${String(n).padStart(2,"0")} — ${m.titulo}</h1>
      <div class="meta">${m.h}h estimadas · ${m.itens.length} conteúdos · ${exs.length} teste(s) prático(s)</div>
      <p class="sub" style="margin-top:8px">${m.topicos}</p>
    </div>
    <div class="panel">
      <h2>Conteúdo do módulo</h2>
      ${m.itens.map(it=>{
        const feito=!!estado[it.id];
        const tipoLabel={curso:"curso",video:"vídeo",cert:"certificado",pratica:"prática",entrega:"entregável",livro:"livro"}[it.t];
        const player=it.embed?`
          <div class="player"><div class="frame" data-embed="${it.embed}">
            <div class="ph" tabindex="0" role="button" aria-label="Reproduzir ${it.n}"><div class="playbtn"></div><span>Assistir no portal</span></div>
          </div>
          <div class="fb">Se o player não iniciar, <a href="https://www.youtube.com/playlist?list=${it.embed}" target="_blank" rel="noopener">abra no YouTube</a>.</div></div>`:"";
        const acts=(it.u&&!it.embed)?`<div class="acts">
            <button type="button" data-view="${it.u}" data-nome="${it.n.replace(/"/g,"&quot;")}">▣ Abrir aqui no portal</button>
            <a href="${it.u}" target="_blank" rel="noopener">Nova aba ↗</a></div>`:"";
        return `<div class="item ${feito?"feito":""}">
          <span class="tipo ${it.t}">${tipoLabel}</span>
          <div class="txt"><div class="nome">${it.n}</div><div class="desc">${it.d||""}</div>${player}${acts}</div>
          <label class="chk"><input type="checkbox" data-chk="${it.id}" ${feito?"checked":""} aria-label="Concluir ${it.n}">concluído</label>
        </div>`;
      }).join("")}
    </div>
    ${exs.length?`<h3 class="secT">🧪 Testes práticos — compilador interno (Python no navegador)</h3>`+
      exs.map(ex=>{
        const feito=!!estado["ex_"+ex.id];
        return `<div class="ex" data-ex="${ex.id}">
          <div class="ex-head" tabindex="0" role="button" aria-expanded="false">
            <span class="badge">teste</span><span class="et">${ex.titulo}</span>
            <span class="est ${feito?"ok":""}">${feito?"✔ concluído":"pendente"}</span>
          </div>
          <div class="ex-body">
            <p class="enun">${ex.enun}</p>
            <div class="esperado"><b>Resultado esperado</b><pre>${ex.esperado}</pre></div>
            <textarea class="editor" spellcheck="false" aria-label="Editor de código Python">${ex.starter}</textarea>
            <div class="ex-actions">
              <button class="btn-run" data-run="${ex.id}">▶ Executar e verificar</button>
              <button class="btn-ghost" data-reset="${ex.id}">↺ Restaurar código</button>
            </div>
            <div class="saida"><div class="s-h">Saída do programa (print)</div><pre></pre><div class="veredito"></div></div>
            <details class="gab"><summary>Ver gabarito (tente sozinho primeiro!)</summary><pre>${escapeHtml(ex.gab)}</pre></details>
          </div>
        </div>`;
      }).join(""):""}
    <div class="navmod-foot">
      <button ${n===1?"disabled":""} data-goto="${n-1}">← Módulo anterior</button>
      <button ${n===MODULOS.length?"disabled":""} data-goto="${n+1}">Próximo módulo →</button>
    </div>`;

  content.querySelectorAll("[data-goto]").forEach(b=>b.addEventListener("click",()=>irPara({tipo:"mod",n:Number(b.getAttribute("data-goto"))})));
  content.querySelectorAll(".ex-head").forEach(h=>{
    const t=()=>{const c=h.closest(".ex");c.classList.toggle("open");h.setAttribute("aria-expanded",c.classList.contains("open"));};
    h.addEventListener("click",t);
    h.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();t();}});
  });
  content.querySelectorAll(".editor").forEach(ed=>{
    ed.addEventListener("keydown",e=>{
      if(e.key==="Tab"){e.preventDefault();
        const s=ed.selectionStart;ed.setRangeText("    ",s,ed.selectionEnd,"end");}
    });
  });
}

/* ---------- viewer central ---------- */
function renderViewer(v){
  crumb.textContent="Visualizando: "+v.nome;
  content.innerHTML=`
    <div class="viewer-bar">
      <button id="vBack">← Voltar ao módulo</button>
      <a href="${v.url}" target="_blank" rel="noopener">Abrir em nova aba ↗</a>
      <span style="font-family:var(--mono);font-size:12px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:50%">${v.url}</span>
    </div>
    <iframe class="viewer-frame" src="${v.url}" referrerpolicy="strict-origin-when-cross-origin" title="${v.nome}"></iframe>
    <div class="viewer-note">Se a janela ficar em branco, este site bloqueia a exibição dentro de outros portais (proteção do próprio site, comum em plataformas com login como Kaggle e freeCodeCamp). Nesse caso use "Abrir em nova aba" — e volte aqui para marcar como concluído.</div>`;
  document.getElementById("vBack").addEventListener("click",()=>irPara({tipo:"mod",n:v.deMod}));
}

/* ---------- eventos globais ---------- */
content.addEventListener("change",e=>{
  const id=e.target.getAttribute&&e.target.getAttribute("data-chk");
  if(!id)return;
  if(e.target.checked)estado[id]=true;else delete estado[id];
  e.target.closest(".item").classList.toggle("feito",e.target.checked);
  atualizarUI();salvar();
});
content.addEventListener("click",e=>{
  const v=e.target.closest("[data-view]");
  if(v){irPara({tipo:"viewer",url:v.getAttribute("data-view"),nome:v.getAttribute("data-nome"),deMod:viewAtual.n});return;}
  const ph=e.target.closest(".ph");
  if(ph){const fr=ph.parentElement;
    fr.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/videoseries?list=${fr.getAttribute("data-embed")}&autoplay=1" title="Player do YouTube" allow="accelerometer; autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;return;}
  const run=e.target.closest("[data-run]");
  if(run){const ex=EXERCICIOS.find(x=>x.id===run.getAttribute("data-run"));executarExercicio(ex,run);return;}
  const rst=e.target.closest("[data-reset]");
  if(rst){const ex=EXERCICIOS.find(x=>x.id===rst.getAttribute("data-reset"));
    rst.closest(".ex-body").querySelector(".editor").value=ex.starter;}
});
content.addEventListener("keydown",e=>{
  const ph=e.target.closest&&e.target.closest(".ph");
  if(ph&&(e.key==="Enter"||e.key===" ")){e.preventDefault();ph.click();}
});
document.getElementById("burger").addEventListener("click",()=>document.body.classList.toggle("side-open"));

/* ---------- boot ---------- */
(async function(){
  montarNav();
  await carregar();
  irPara({tipo:"dash"});
})();
</script>
